name: Frontend build verification

on:
  push:
    branches:
      - fix/frontend-build
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: npm ci and npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
