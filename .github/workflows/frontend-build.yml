name: Frontend build verification

on:
  push:
    branches:
      - fix/frontend-build
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: npm ci and npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "fix(build): synchronize npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "package-lock.json is already synchronized."
          fi
      - name: Clean install
        run: npm ci
      - name: Build Next.js app
        run: npm run build
