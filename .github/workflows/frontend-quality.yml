name: Frontend quality checks

on:
  push:
    branches:
      - ci/verify-current-master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Type-check
        id: typecheck
        run: npm run type-check
      - name: Lint
        id: lint
        run: npm run lint
      # Still run the production build when lint finds pre-existing issues,
      # provided dependency installation and TypeScript checking succeeded.
      - name: Production build
        id: build
        if: ${{ always() && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        run: npm run build
