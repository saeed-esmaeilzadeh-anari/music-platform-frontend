name: Frontend quality checks

on:
  push:
    branches:
      - ci/verify-current-master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Type-check, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
