name: Frontend CI

on:
  push:
    branches: [master, "finalize/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and contract tests
        run: npm test
      - name: Type-check
        run: npm run type-check
      - name: Repository-wide ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Production route smoke tests
        run: npm run test:e2e
