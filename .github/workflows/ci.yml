name: Frontend CI

on:
  push:
    branches: [master, "finalize/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint changed integration files
        run: npx eslint src/lib/api/http-client.ts src/lib/i18n/messages.ts
      - name: Production build
        run: npm run build
